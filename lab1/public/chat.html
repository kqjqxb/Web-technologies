<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="chat">
    <aside class="sidebar">
      <div class="card">
        Room: <b id="room-name"></b><br>
        Username: <b id="user-name"></b>
      </div>
      <div class="card list">
        <div class="list-title">Users in the chatroom</div>
        <ul id="users"></ul>
      </div>
      <a href="index.html" class="btn leave">Вийти</a>
    </aside>
    <section class="main">
      <div id="messages" class="messages"></div>
      <form id="chat-form" class="chat-form">
        <input id="msg" type="text" placeholder="Message" autocomplete="off" required>
        <button type="submit" class="btn">Send</button>
      </form>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
