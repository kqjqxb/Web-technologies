<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чат – вхід</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="join">
    <h1>Чат реального часу</h1>
    <form class="join-form" action="chat.html" method="get">
      <input type="text" name="username" placeholder="Ім’я користувача" maxlength="30" required autofocus>
      <input type="text" name="room" placeholder="Кімната" maxlength="30" required>
      <button type="submit" class="btn">Приєднатись</button>
    </form>
  </main>
</body>
</html>
